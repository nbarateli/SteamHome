<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <title>Steam Home</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="styles/reset.css" media="screen" rel="stylesheet" type="text/css"/>
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css"
          integrity="sha384-lKuwvrZot6UHsBSfcMvOkWwlCMgc0TaWr+30HWe3a4ltaBwTZhyTEggF5tJv8tbt"
          rel="stylesheet">


    <link href="styles/main.css" media="screen" rel="stylesheet" type="text/css"/>
    <script src="script/dateformat.js"></script>
    <script src="script/main.js"></script>
</head>

<body>
<div id="date-time">
    <div class="clock" id="date"></div>
    <div class="clock" id='clock'></div>
</div>
<div id="container">
    <div class="content">
        <div id="search">
            <form action="https://google.com/search" autocomplete="off" class="example">
                <input name="q" placeholder="Search.." type="text">
                <button type="submit"><i class="fas fa-search"></i></button>

            </form>
            <a data-key="g" href="https://google.com" target="_parent">Google</a>
        </div>
        <a data-key="f" href="https://fb.com/messages" id="fb" target="_self">FB</a>
        <a data-key="i" href="https://instagram.com" id="insta" target="_self">Instagram</a>
        <a data-key="d" href="https://nbarateli.github.io/DotaGenerator" id="dota" target="_top">DotaGenerator</a>
    </div>
</div>
</body>

</html>
